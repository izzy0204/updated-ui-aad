[project]
name = "medical-card-gen"
version = "0.1.0"
description = "Streamlit app for medical AI model cards"
requires-python = ">=3.10"
dependencies = [
    "streamlit",
    "google-genai",
    "python-dotenv",
    "google-api-python-client",
