[project]
name = "aad-model-card-generator"
version = "0.1.0"
description = "AI Model Card Generator for Dermatology AI Models"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.12.14",
    "beautifulsoup4>=4.13.4",
    "chardet>=5.2.0",
    "google-genai>=1.12.0",
    "openai>=1.97.0",
    "pdfminer-six>=20250506",
    "pypdf>=6.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.4",
    "streamlit>=1.47.0",
    "trafilatura>=2.0.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
